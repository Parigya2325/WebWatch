{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">👤 My Profile</h2>

<div class="card shadow">

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="username"
                    value="{{ user.username }}"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    class="form-control"
                    name="email"
                    value="{{ user.email }}"
                    required
                >

            </div>

            <button class="btn btn-primary">
                Save Changes
            </button>

        </form>

    </div>

</div>

{% endblock %}
