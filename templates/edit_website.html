{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>Edit Website</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Website Name</label>

<input
class="form-control"
name="website_name"
value="{{ website.website_name }}"
required>

</div>

<div class="mb-3">

<label>Website URL</label>

<input
class="form-control"
name="url"
value="{{ website.url }}"
required>

</div>

<div class="mb-3">

<label>Monitoring Interval</label>

<input
class="form-control"
name="interval"
value="{{ website.monitoring_interval }}"
required>

</div>

<button class="btn btn-success">

Save Changes

</button>

</form>

</div>

</div>

</div>

{% endblock %}
